<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#0D1528"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="170" fill="url(#bg)"/>

  <!-- KSAS -->
  <g transform="translate(16,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#34D399"/>
    <g transform="translate(20,28)" filter="url(#glow)">
      <rect width="16" height="16" fill="#34D399" opacity="0.95"/>
      <rect x="20" width="16" height="16" fill="#34D399" opacity="0.5"/>
      <rect y="20" width="16" height="16" fill="#34D399" opacity="0.5"/>
      <rect x="20" y="20" width="7" height="7" fill="#34D399"/>
      <rect x="29" y="29" width="7" height="7" fill="#34D399" opacity="0.8"/>
      <rect x="0" y="0" width="36" height="2.5" fill="#22D3EE">
        <animate attributeName="y" values="0;36;0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">KSAS</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#34D399">QR expires in 5s</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">React · TS · Firebase</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">attendance that cannot be faked</text>
  </g>

  <!-- Juriscore -->
  <g transform="translate(330,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#A78BFA"/>
    <g transform="translate(20,24)" filter="url(#glow)">
      <line x1="28" y1="8" x2="28" y2="52" stroke="#A78BFA" stroke-width="1.5"/>
      <circle cx="28" cy="6" r="3.5" fill="#A78BFA"/>
      <g stroke="#A78BFA" stroke-width="1.5" fill="none">
        <line x1="8" y1="20" x2="48" y2="20">
          <animateTransform attributeName="transform" type="rotate" values="-8 28 20;8 28 20;-8 28 20" dur="2.4s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle cx="8" cy="34" r="7" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.9">
        <animate attributeName="cy" values="36;32;36" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="48" cy="34" r="7" fill="none" stroke="#F472B6" stroke-width="1.2" opacity="0.9">
        <animate attributeName="cy" values="32;36;32" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">Juriscore</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#A78BFA">cases · briefs · citations</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">React Native · FastAPI</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">legal research for Kenya</text>
  </g>

  <!-- USSD -->
  <g transform="translate(644,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#38BDF8"/>
    <g transform="translate(18,22)" filter="url(#glow)">
      <rect width="34" height="54" rx="7" fill="#111827" stroke="#334155" stroke-width="1.2"/>
      <text x="17" y="18" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#34D399">*384#</text>
      <g fill="#1E293B">
        <circle cx="9" cy="30" r="2.2"/><circle cx="17" cy="30" r="2.2"/><circle cx="25" cy="30" r="2.2"/>
        <circle cx="9" cy="42" r="2.2"/><circle cx="17" cy="42" r="2.2" fill="#0EA5E9">
          <animate attributeName="r" values="2;3.5;2" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="25" cy="42" r="2.2"/>
      </g>
      <g fill="none" stroke="#38BDF8" stroke-width="1.2">
        <path d="M42 28 Q54 16 66 28" opacity="0.8">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M42 28 Q60 8 78 28" opacity="0.5">
          <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.4s" begin="0.25s" repeatCount="indefinite"/>
        </path>
        <path d="M42 28 Q66 0 90 28" opacity="0.3">
          <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">USSD Attend</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#38BDF8">any phone · no app</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">Node · Express · Postgres</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">feature-phone check-in</text>
  </g>
</svg>
