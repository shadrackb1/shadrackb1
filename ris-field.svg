<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="280" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.7">
    <line x1="0" y1="70" x2="880" y2="70"/>
    <line x1="0" y1="140" x2="880" y2="140"/>
    <line x1="0" y1="210" x2="880" y2="210"/>
    <line x1="110" y1="0" x2="110" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="330" y1="0" x2="330" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="550" y1="0" x2="550" y2="280"/>
    <line x1="660" y1="0" x2="660" y2="280"/>
    <line x1="770" y1="0" x2="770" y2="280"/>
  </g>

  <!-- OFFLINE badge: cloud with slash -->
  <g transform="translate(700,36)" filter="url(#glow)">
    <ellipse cx="28" cy="22" rx="22" ry="12" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M10 22 Q18 8 28 12 Q40 6 46 20" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <line x1="8" y1="34" x2="50" y2="8" stroke="#F87171" stroke-width="2.5"/>
    <text x="58" y="26" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">OFFLINE</text>
  </g>

  <!-- USB stick -->
  <g transform="translate(48,88)" filter="url(#glow)">
    <!-- metal tip -->
    <rect x="0" y="28" width="36" height="36" rx="3" fill="#94A3B8"/>
    <rect x="6" y="36" width="8" height="8" fill="#0B0F17"/>
    <rect x="18" y="36" width="8" height="8" fill="#0B0F17"/>
    <rect x="6" y="50" width="8" height="8" fill="#0B0F17"/>
    <rect x="18" y="50" width="8" height="8" fill="#0B0F17"/>
    <!-- body -->
    <rect x="36" y="22" width="110" height="48" rx="8" fill="url(#usb)"/>
    <rect x="48" y="34" width="50" height="8" rx="2" fill="#0B0F17" opacity="0.35"/>
    <rect x="48" y="48" width="30" height="6" rx="2" fill="#0B0F17" opacity="0.25"/>
    <!-- LED -->
    <circle cx="128" cy="46" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- data stream from USB into local brain -->
  <g filter="url(#soft)">
    <path d="M200 136 C280 136 300 90 380 90" fill="none" stroke="url(#beam)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 240;240 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M200 136 C290 150 320 180 400 170" fill="none" stroke="url(#beam)" stroke-width="1.5" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0 260;260 0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M200 136 C300 120 340 140 420 130" fill="none" stroke="url(#beam)" stroke-width="1.2" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0 280;280 0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- floating particles along stream -->
  <g fill="#22D3EE">
    <circle r="2.5">
      <animateMotion dur="2s" repeatCount="indefinite" path="M200,136 C280,136 300,90 380,90"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M200,136 C290,150 320,180 400,170"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#A78BFA">
      <animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite" path="M200,136 C300,120 340,140 420,130"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- local neural core -->
  <g transform="translate(400,70)" filter="url(#glow)">
    <!-- outer rings -->
    <circle cx="70" cy="70" r="58" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="46" fill="none" stroke="#334155" stroke-width="1">
      <animate attributeName="r" values="46;52;46" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- network nodes -->
    <g stroke="#22D3EE" stroke-width="1" opacity="0.75">
      <line x1="70" y1="70" x2="40" y2="40"/>
      <line x1="70" y1="70" x2="105" y2="38"/>
      <line x1="70" y1="70" x2="110" y2="80"/>
      <line x1="70" y1="70" x2="45" y2="100"/>
      <line x1="70" y1="70" x2="90" y2="110"/>
      <line x1="40" y1="40" x2="105" y2="38"/>
      <line x1="45" y1="100" x2="90" y2="110"/>
      <line x1="110" y1="80" x2="105" y2="38"/>
    </g>
    <g fill="url(#node)">
      <circle cx="70" cy="70" r="8">
        <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="40" r="4"/>
      <circle cx="105" cy="38" r="4">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="80" r="4"/>
      <circle cx="45" cy="100" r="4">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="110" r="4"/>
      <circle cx="55" cy="55" r="3" fill="#4ADE80"/>
      <circle cx="95" cy="60" r="3" fill="#FBBF24"/>
      <circle cx="75" cy="95" r="3" fill="#F472B6"/>
    </g>
  </g>

  <!-- RAG pipeline chips -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="11">
    <g transform="translate(560,58)">
      <rect width="88" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="14" y="18" fill="#94A3B8">ingest</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(660,58)">
      <rect width="88" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="12" y="18" fill="#94A3B8">embed</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="0.35s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(560,100)">
      <rect width="88" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="10" y="18" fill="#94A3B8">retrieve</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(660,100)">
      <rect width="88" height="28" rx="6" fill="#0F172A" stroke="#22D3EE"/>
      <text x="14" y="18" fill="#22D3EE">answer</text>
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="1.05s" repeatCount="indefinite"/>
    </g>
    <!-- arrows -->
    <g stroke="#475569" stroke-width="1.2" fill="none">
      <path d="M648 72 H660"/>
      <path d="M704 86 V100"/>
      <path d="M648 114 H660"/>
    </g>
  </g>

  <!-- citation engine -->
  <g transform="translate(560,160)" font-family="ui-monospace,Menlo,monospace">
    <rect width="200" height="70" rx="10" fill="#111827" stroke="#334155"/>
    <text x="16" y="28" font-size="11" fill="#64748B">citation engine</text>
    <text x="16" y="50" font-size="13" fill="#E2E8F0">APA 7 · Vancouver · Harvard</text>
    <circle cx="180" cy="22" r="4" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer labels -->
  <text x="48" y="250" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748B">Research in a Stick · local models · no cloud · Kiswahili + English</text>
  <text x="48" y="270" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#475569">LangChain · ChromaDB · Ollama · Kiwix · Python</text>
</svg>
