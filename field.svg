<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="140" fill="#0B0F17"/>
  <!-- Tesla coil / field lines -->
  <g fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.55" filter="url(#glow)">
    <path d="M40,100 Q180,20 360,70 T680,40">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M40,100 Q180,20 360,70 T680,40;
                M40,70 Q200,110 360,40 T680,90;
                M40,100 Q180,20 360,70 T680,40"/>
    </path>
    <path d="M40,120 Q220,40 360,90 T680,55" opacity="0.7">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M40,120 Q220,40 360,90 T680,55;
                M40,90 Q180,120 360,50 T680,100;
                M40,120 Q220,40 360,90 T680,55"/>
    </path>
    <path d="M40,55 Q260,100 400,45 T680,75" opacity="0.4">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M40,55 Q260,100 400,45 T680,75;
                M40,85 Q240,30 400,95 T680,50;
                M40,55 Q260,100 400,45 T680,75"/>
    </path>
  </g>
  <!-- Pulsing nodes -->
  <g fill="#22D3EE" filter="url(#glow)">
    <circle cx="360" cy="70" r="3">
      <animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="55" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="50" r="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="360" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8" letter-spacing="4">FIELD · RESONANCE · CONVERGENCE</text>
</svg>
