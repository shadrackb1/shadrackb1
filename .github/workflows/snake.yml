name: Generate snake animation

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shadrackb1
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-green.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%231E293B,%23155E75,%2322D3EE,%23818CF8,%23F472B6
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/github-snake*.svg
          git diff --staged --quiet || git commit -m "chore: refresh snake animation"
          git pull --rebase origin main || true
          git push
