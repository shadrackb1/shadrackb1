name: Metrics isometric calendar

on:
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          template: classic
          user: shadrackb1
          filename: dist/metrics-isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community
          config_timezone: Africa/Nairobi
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_achievements: yes
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          output_action: none
      - name: Commit metrics
        run: |
          mkdir -p dist
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/metrics-isocalendar.svg || true
          git diff --staged --quiet || git commit -m "chore: refresh metrics calendar"
          git pull --rebase origin main || true
          git push
