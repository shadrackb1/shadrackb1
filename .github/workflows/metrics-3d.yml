name: 3D contribution graph

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  contrib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shadrackb1
      - name: Commit 3d SVG
        run: |
          mkdir -p dist
          for f in profile-*.svg profile-night-*.svg; do
            [ -f "$f" ] || continue
            cp "$f" dist/profile-3d.svg
            break
          done
          if [ -f dist/profile-3d.svg ]; then
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f dist/profile-3d.svg
            git diff --staged --quiet || git commit -m "chore: refresh 3d contribution graph"
            git push
          else
            echo "No SVG produced"
            ls -la
          fi
