<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#0D1528"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="170" fill="url(#bg2)"/>

  <!-- EFK Battles -->
  <g transform="translate(16,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#F472B6"/>
    <g transform="translate(18,26)" filter="url(#glow2)">
      <g font-family="ui-monospace,Menlo,monospace" font-size="9">
        <rect width="52" height="14" rx="3" fill="#161B22" stroke="#F472B6" stroke-width="1"/>
        <text x="26" y="10" text-anchor="middle" fill="#F9A8D4">P1</text>
        <rect y="20" width="52" height="14" rx="3" fill="#161B22" stroke="#30363D"/>
        <text x="26" y="30" text-anchor="middle" fill="#64748B">P2</text>
        <rect y="40" width="52" height="14" rx="3" fill="#161B22" stroke="#30363D"/>
        <text x="26" y="50" text-anchor="middle" fill="#64748B">P3</text>
        <path d="M52 20 H62 V30 H72" fill="none" stroke="#334155" stroke-width="1"/>
        <path d="M52 40 H62 V30" fill="none" stroke="#334155" stroke-width="1"/>
        <rect x="72" y="16" width="48" height="16" rx="3" fill="#161B22" stroke="#F472B6">
          <animate attributeName="stroke" values="#F472B6;#22D3EE;#F472B6" dur="2s" repeatCount="indefinite"/>
        </rect>
        <text x="96" y="27" text-anchor="middle" fill="#E2E8F0">FIN</text>
        <circle cx="140" cy="24" r="5" fill="#FBBF24">
          <animate attributeName="r" values="4;7;4" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.5;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">EFK Battles</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#F472B6">KES 100 · auto bracket</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">Next.js · Supabase · M-Pesa</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">eFootball tournaments KE</text>
  </g>

  <!-- FieldOps -->
  <g transform="translate(330,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#22D3EE"/>
    <g transform="translate(18,24)" filter="url(#glow2)">
      <g stroke="#1E293B" stroke-width="1">
        <line x1="0" y1="16" x2="70" y2="16"/><line x1="0" y1="36" x2="70" y2="36"/><line x1="0" y1="56" x2="70" y2="56"/>
        <line x1="16" y1="0" x2="16" y2="70"/><line x1="40" y1="0" x2="40" y2="70"/><line x1="64" y1="0" x2="64" y2="70"/>
      </g>
      <circle cx="16" cy="20" r="4" fill="#22D3EE">
        <animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="48" cy="44" r="4" fill="#34D399">
        <animate attributeName="r" values="3;6;3" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="16" r="4" fill="#F59E0B">
        <animate attributeName="opacity" values="1;0.25;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="56" r="3.5" fill="#22D3EE" opacity="0.8"/>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">FieldOps</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#22D3EE">sites · fuel · 47 counties</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">React · TypeScript · Firebase</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">field operations dashboard</text>
  </g>

  <!-- Playground -->
  <g transform="translate(644,16)">
    <rect width="300" height="138" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <rect width="4" height="138" rx="2" fill="#F59E0B"/>
    <g transform="translate(18,24)" filter="url(#glow2)">
      <!-- bouncing dots like a game -->
      <rect x="0" y="20" width="12" height="12" rx="2" fill="#34D399">
        <animate attributeName="y" values="20;0;20" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="20" width="12" height="12" rx="2" fill="#22D3EE">
        <animate attributeName="y" values="20;4;20" dur="1.1s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="20" width="12" height="12" rx="2" fill="#818CF8">
        <animate attributeName="y" values="20;0;20" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="20" width="12" height="12" rx="2" fill="#F472B6">
        <animate attributeName="y" values="20;6;20" dur="1.1s" begin="0.45s" repeatCount="indefinite"/>
      </rect>
      <!-- snake trail -->
      <rect x="0" y="48" width="8" height="8" rx="2" fill="#34D399" opacity="0.9">
        <animate attributeName="x" values="0;50;50;0;0" keyTimes="0;0.3;0.5;0.8;1" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="48;48;60;60;48" keyTimes="0;0.3;0.5;0.8;1" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="48" width="8" height="8" rx="2" fill="#34D399" opacity="0.45">
        <animate attributeName="x" values="0;50;50;0;0" keyTimes="0;0.35;0.55;0.85;1" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="48;48;60;60;48" keyTimes="0;0.35;0.55;0.85;1" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="70" cy="54" r="3.5" fill="#F87171">
        <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="68" y="48" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#E2E8F0">Playground</text>
    <text x="68" y="68" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#F59E0B">games · USSD · RIS lab</text>
    <text x="20" y="108" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">Canvas · no frameworks</text>
    <text x="20" y="126" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">shadrackb1.github.io/playground</text>
  </g>
</svg>
