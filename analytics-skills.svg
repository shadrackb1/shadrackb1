<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#140B20"/>
    </linearGradient>
    <radialGradient id="rg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="300" fill="url(#bg)"/>
  <text x="32" y="36" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94A3B8" letter-spacing="3">CREDENTIALS · SKILLS RADAR</text>

  <!-- Certs donut -->
  <g transform="translate(150,160)">
    <text x="0" y="-100" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">24 AI CERTIFICATIONS</text>
    <circle r="70" fill="none" stroke="#1E293B" stroke-width="20"/>
    <!-- 15 Anthropic = 62.5% of 24; circumference 2pi*70≈440 -->
    <circle r="70" fill="none" stroke="#D97706" stroke-width="20" stroke-dasharray="275 165" stroke-dashoffset="0" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="0 440;275 165" dur="1.3s" fill="freeze"/>
    </circle>
    <!-- 4 Microsoft = 16.7% ≈ 73 -->
    <circle r="70" fill="none" stroke="#3B82F6" stroke-width="20" stroke-dasharray="73 367" stroke-dashoffset="-275" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="0 440;73 367" dur="1.3s" begin="0.2s" fill="freeze"/>
    </circle>
    <!-- Helsinki 1 + Kaggle 1 + other 3 = 5 ≈ 92 -->
    <circle r="70" fill="none" stroke="#A78BFA" stroke-width="20" stroke-dasharray="92 348" stroke-dashoffset="-348" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="0 440;92 348" dur="1.3s" begin="0.4s" fill="freeze"/>
    </circle>
    <text y="-4" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#F5F5F4" font-weight="600">24</text>
    <text y="18" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#A8A29E">certs</text>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="12" transform="translate(50,250)">
    <rect width="10" height="10" y="2" rx="2" fill="#D97706"/><text x="16" y="11" fill="#E7E5E4">Anthropic 15</text>
    <rect width="10" height="10" y="2" rx="2" fill="#3B82F6" x="130"/><text x="146" y="11" fill="#E7E5E4">Microsoft 4</text>
    <rect width="10" height="10" y="2" rx="2" fill="#A78BFA" x="250"/><text x="266" y="11" fill="#E7E5E4">Other 5</text>
  </g>

  <!-- Skills radar -->
  <g transform="translate(580,155)">
    <circle r="110" fill="url(#rg)" opacity="0.4"/>
    <!-- hex rings -->
    <g fill="none" stroke="#1E293B" stroke-width="1">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"/>
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" opacity="0.8"/>
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" opacity="0.6"/>
      <polygon points="0,-25 21.7,-12.5 21.7,12.5 0,25 -21.7,12.5 -21.7,-12.5" opacity="0.4"/>
    </g>
    <g stroke="#334155" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-100"/>
      <line x1="0" y1="0" x2="86.6" y2="-50"/>
      <line x1="0" y1="0" x2="86.6" y2="50"/>
      <line x1="0" y1="0" x2="0" y2="100"/>
      <line x1="0" y1="0" x2="-86.6" y2="50"/>
      <line x1="0" y1="0" x2="-86.6" y2="-50"/>
    </g>
    <!-- skill polygon: Legal 90, AI/RAG 95, Full-stack 85, Payments 75, Infra 70, Teaching 80 -->
    <!-- convert polar to cartesian, r = skill/100 * 100 -->
    <polygon fill="#22D3EE" fill-opacity="0.2" stroke="#22D3EE" stroke-width="2"
      points="0,-90 82.3,-47.5 72.8,42 0,75 -59.8,34.6 -69.3,-40">
      <animate attributeName="fill-opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <g fill="#E2E8F0">
      <circle cx="0" cy="-90" r="3.5"/>
      <circle cx="82.3" cy="-47.5" r="3.5"/>
      <circle cx="72.8" cy="42" r="3.5"/>
      <circle cx="0" cy="75" r="3.5"/>
      <circle cx="-59.8" cy="34.6" r="3.5"/>
      <circle cx="-69.3" cy="-40" r="3.5"/>
    </g>
    <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#94A3B8">
      <text x="0" y="-118" text-anchor="middle">Legal</text>
      <text x="105" y="-52">AI / RAG</text>
      <text x="105" y="58">Full-stack</text>
      <text x="0" y="122" text-anchor="middle">Payments</text>
      <text x="-105" y="58" text-anchor="end">Infra</text>
      <text x="-105" y="-52" text-anchor="end">Teaching</text>
    </g>
  </g>

  <!-- badges -->
  <g transform="translate(300,55)" font-family="ui-monospace,Menlo,monospace" font-size="12">
    <rect width="140" height="36" rx="18" fill="#1C1208" stroke="#D97706"/>
    <text x="22" y="23" fill="#FCD34D">Claude Academy ×15</text>
    <rect y="48" width="130" height="36" rx="18" fill="#0B1220" stroke="#3B82F6"/>
    <text x="18" y="71" fill="#93C5FD">Microsoft Learn</text>
    <rect y="96" width="120" height="36" rx="18" fill="#0B1220" stroke="#A78BFA"/>
    <text x="18" y="119" fill="#C4B5FD">Elements of AI</text>
    <rect y="144" width="100" height="36" rx="18" fill="#0B1220" stroke="#34D399"/>
    <text x="22" y="167" fill="#6EE7B7">Kaggle</text>
    <rect y="192" width="100" height="36" rx="18" fill="#0B1220" stroke="#F472B6"/>
    <text x="22" y="215" fill="#F9A8D4">NVIDIA DLI*</text>
  </g>
</svg>
