<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bg)"/>

  <!-- blueprint grid -->
  <g stroke="#152036" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60"/><line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/><line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/><line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="880" y1="0" x2="880" y2="420"/>
  </g>

  <!-- title bar -->
  <text x="40" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#64748B" letter-spacing="3">SYSTEMS MAP · EAST AFRICA</text>
  <text x="920" y="36" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#475569">shadrackb1</text>

  <!-- ========== LEFT: RIS USB ========== -->
  <g transform="translate(48,70)">
    <text x="0" y="0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#22D3EE">01 · RIS</text>
    <text x="0" y="22" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#E2E8F0">Research in a Stick</text>
    <text x="0" y="44" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">offline RAG · USB · no cloud</text>

    <!-- USB -->
    <g transform="translate(0,70)" filter="url(#glow)">
      <rect x="0" y="18" width="28" height="28" rx="2" fill="#94A3B8"/>
      <rect x="5" y="24" width="6" height="6" fill="#0B1220"/>
      <rect x="15" y="24" width="6" height="6" fill="#0B1220"/>
      <rect x="5" y="34" width="6" height="6" fill="#0B1220"/>
      <rect x="15" y="34" width="6" height="6" fill="#0B1220"/>
      <rect x="28" y="12" width="86" height="40" rx="7" fill="#0EA5E9"/>
      <rect x="38" y="22" width="38" height="7" rx="2" fill="#0B1220" opacity="0.3"/>
      <circle cx="98" cy="32" r="4" fill="#4ADE80">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- stream to local core -->
    <path d="M130 120 C170 120 180 150 220 150" fill="none" stroke="url(#wire)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 160;160 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle r="2.5" fill="#22D3EE">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M130,120 C170,120 180,150 220,150"/>
    </circle>

    <!-- local brain -->
    <g transform="translate(220,110)" filter="url(#glow)">
      <circle cx="40" cy="40" r="36" fill="url(#core)" opacity="0.25"/>
      <circle cx="40" cy="40" r="28" fill="none" stroke="#22D3EE" stroke-width="1.5">
        <animate attributeName="r" values="26;32;26" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#67E8F9" stroke-width="1" opacity="0.8">
        <line x1="40" y1="40" x2="18" y2="20"/><line x1="40" y1="40" x2="64" y2="18"/>
        <line x1="40" y1="40" x2="70" y2="48"/><line x1="40" y1="40" x2="22" y2="62"/>
        <line x1="40" y1="40" x2="55" y2="68"/>
      </g>
      <g fill="#A5F3FC">
        <circle cx="40" cy="40" r="6"/>
        <circle cx="18" cy="20" r="3"/><circle cx="64" cy="18" r="3"/>
        <circle cx="70" cy="48" r="3"/><circle cx="22" cy="62" r="3"/>
        <circle cx="55" cy="68" r="3"/>
      </g>
      <circle cx="28" cy="32" r="2.5" fill="#4ADE80"/>
      <circle cx="52" cy="36" r="2.5" fill="#FBBF24"/>
    </g>

    <!-- chips -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#94A3B8">
      <rect x="0" y="220" width="72" height="22" rx="4" fill="#111827" stroke="#1E293B"/>
      <text x="12" y="235">Ollama</text>
      <rect x="80" y="220" width="88" height="22" rx="4" fill="#111827" stroke="#1E293B"/>
      <text x="90" y="235">LangChain</text>
      <rect x="0" y="250" width="88" height="22" rx="4" fill="#111827" stroke="#1E293B"/>
      <text x="10" y="265">ChromaDB</text>
      <rect x="96" y="250" width="72" height="22" rx="4" fill="#111827" stroke="#1E293B"/>
      <text x="108" y="265">Kiwix</text>
    </g>
  </g>

  <!-- ========== CENTER: product grid ========== -->
  <g transform="translate(340,70)">
    <text x="0" y="0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#818CF8">02 · SHIPPED</text>
    <text x="0" y="22" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#E2E8F0">Product surface</text>

    <!-- 6 product tiles -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="11">
      <g transform="translate(0,50)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">Juriscore</text>
        <text x="12" y="48" fill="#64748B">legal research</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#A78BFA"/>
      </g>
      <g transform="translate(145,50)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">USSD Attend</text>
        <text x="12" y="48" fill="#64748B">any phone</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#34D399"/>
      </g>
      <g transform="translate(0,135)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">FieldOps</text>
        <text x="12" y="48" fill="#64748B">47 counties</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#38BDF8"/>
      </g>
      <g transform="translate(145,135)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">EFK Battles</text>
        <text x="12" y="48" fill="#64748B">M-Pesa · bracket</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#F472B6"/>
      </g>
      <g transform="translate(0,220)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">Law Beyond</text>
        <text x="12" y="48" fill="#64748B">study systems</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#FBBF24"/>
      </g>
      <g transform="translate(145,220)">
        <rect width="130" height="70" rx="8" fill="#0F172A" stroke="#1E293B"/>
        <text x="12" y="28" fill="#E2E8F0">Mingle</text>
        <text x="12" y="48" fill="#64748B">matchmaking KE</text>
        <rect x="0" y="0" width="4" height="70" rx="2" fill="#FB7185"/>
        <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- ========== RIGHT: network / access ========== -->
  <g transform="translate(680,70)">
    <text x="0" y="0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#F472B6">03 · ACCESS LAYER</text>
    <text x="0" y="22" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#E2E8F0">Meet the network</text>
    <text x="0" y="44" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">USSD · PWA · M-Pesa · WhatsApp</text>

    <!-- phone -->
    <g transform="translate(10,70)">
      <rect x="0" y="0" width="70" height="110" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <rect x="10" y="14" width="50" height="24" rx="3" fill="#0B1220"/>
      <text x="35" y="30" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#34D399">*384*9#</text>
      <g fill="#1E293B">
        <circle cx="20" cy="55" r="4"/><circle cx="35" cy="55" r="4"/><circle cx="50" cy="55" r="4"/>
        <circle cx="20" cy="72" r="4"/><circle cx="35" cy="72" r="4" fill="#0EA5E9"><animate attributeName="fill" values="#1E293B;#0EA5E9;#1E293B" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="50" cy="72" r="4"/>
        <circle cx="20" cy="89" r="4"/><circle cx="35" cy="89" r="4"/><circle cx="50" cy="89" r="4"/>
      </g>
    </g>

    <!-- signal arcs -->
    <g fill="none" stroke="#F472B6" stroke-width="1.3">
      <path d="M90 120 Q120 90 150 120" opacity="0.7">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M90 120 Q135 70 180 120" opacity="0.45">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.4s" begin="0.25s" repeatCount="indefinite"/>
      </path>
      <path d="M90 120 Q150 50 210 120" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- access pills -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="11">
      <rect x="0" y="200" width="90" height="26" rx="13" fill="#052E16" stroke="#22C55E"/>
      <text x="18" y="217" fill="#4ADE80">M-Pesa</text>
      <rect x="100" y="200" width="100" height="26" rx="13" fill="#0C1A2E" stroke="#38BDF8"/>
      <text x="116" y="217" fill="#7DD3FC">WhatsApp</text>
      <rect x="0" y="240" width="90" height="26" rx="13" fill="#1E1030" stroke="#A78BFA"/>
      <text x="22" y="257" fill="#C4B5FD">PWA</text>
      <rect x="100" y="240" width="90" height="26" rx="13" fill="#1C1010" stroke="#F87171"/>
      <text x="22" y="257" fill="#FCA5A5"></text>
      <text x="118" y="257" fill="#FCA5A5">USSD</text>
    </g>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="392" width="960" height="28" fill="#060A12"/>
  <text x="40" y="410" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#475569">LLB Kabarak · 24 AI certs · team lead RIS · robotics workshops · Nairobi, Kenya</text>
  <text x="920" y="410" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#22D3EE">build · ship · maintain</text>
</svg>
