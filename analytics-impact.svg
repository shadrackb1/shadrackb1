<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#120A1F"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="280" rx="0" fill="url(#bg)"/>
  <text x="32" y="36" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94A3B8" letter-spacing="3">IMPACT · RESEARCH IN A STICK</text>

  <!-- Gauge 1: university students -->
  <g transform="translate(80,60)">
    <text x="90" y="0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748B">UNIVERSITY</text>
    <g transform="translate(90,120)">
      <circle r="78" fill="none" stroke="#1E293B" stroke-width="14"/>
      <circle r="78" fill="none" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="490;98;98" dur="2.2s" fill="freeze"/>
      </circle>
      <text y="-8" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="32" fill="#E2E8F0" font-weight="600">
        <tspan>4.5</tspan><tspan font-size="18" fill="#22D3EE">M</tspan>
      </text>
      <text y="18" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">students</text>
    </g>
  </g>

  <!-- Gauge 2: secondary -->
  <g transform="translate(260,60)">
    <text x="90" y="0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748B">SECONDARY</text>
    <g transform="translate(90,120)">
      <circle r="78" fill="none" stroke="#1E293B" stroke-width="14"/>
      <circle r="78" fill="none" stroke="url(#g2)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="490;147;147" dur="2.4s" begin="0.15s" fill="freeze"/>
      </circle>
      <text y="-8" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="32" fill="#E2E8F0" font-weight="600">
        <tspan>3</tspan><tspan font-size="18" fill="#34D399">M</tspan>
      </text>
      <text y="18" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">students</text>
    </g>
  </g>

  <!-- Gauge 3: researchers -->
  <g transform="translate(440,60)">
    <text x="90" y="0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748B">RESEARCHERS</text>
    <g transform="translate(90,120)">
      <circle r="78" fill="none" stroke="#1E293B" stroke-width="14"/>
      <circle r="78" fill="none" stroke="url(#g3)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="490;345;345" dur="2.6s" begin="0.3s" fill="freeze"/>
      </circle>
      <text y="-8" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="32" fill="#E2E8F0" font-weight="600">
        <tspan>500</tspan><tspan font-size="16" fill="#F59E0B">K</tspan>
      </text>
      <text y="18" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">rural &amp; health</text>
    </g>
  </g>

  <!-- side stats -->
  <g transform="translate(660,55)" font-family="ui-monospace,Menlo,monospace">
    <rect width="260" height="200" rx="14" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="32" font-size="11" fill="#94A3B8" letter-spacing="2">UNIT ECONOMICS</text>
    <text x="20" y="70" font-size="28" fill="#22D3EE" font-weight="600">KES 2,500</text>
    <text x="20" y="92" font-size="12" fill="#64748B">per unit, lower bound</text>
    <line x1="20" y1="110" x2="240" y2="110" stroke="#1E293B"/>
    <text x="20" y="140" font-size="28" fill="#A78BFA" font-weight="600">KES 6,000</text>
    <text x="20" y="162" font-size="12" fill="#64748B">per unit, upper bound</text>
    <text x="20" y="190" font-size="11" fill="#34D399">no cloud fees · no data plan</text>
  </g>

  <!-- county dots strip -->
  <g transform="translate(32,255)">
    <text x="0" y="0" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">47 counties in field-ops scope</text>
    <g transform="translate(220,-8)">
      <script/>
    </g>
  </g>
