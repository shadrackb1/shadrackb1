      <circle cx="160" cy="0" r="2.5" fill="#F472B6" opacity="0.8"/>
      <circle cx="170" cy="0" r="2.5" fill="#F472B6" opacity="0.75"/>
      <circle cx="180" cy="0" r="2.5" fill="#34D399" opacity="0.9"/>
