<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="200" fill="#0B1220"/>
  <text x="24" y="28" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748B" letter-spacing="2">PLAYGROUND · LIVE</text>

  <!-- SNAKE -->
  <g transform="translate(24,48)">
    <rect width="200" height="130" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="12" y="20" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#34D399">snake.js</text>
    <!-- grid dots -->
    <g fill="#1E293B">
      <circle cx="40" cy="40" r="1"/><circle cx="70" cy="40" r="1"/><circle cx="100" cy="40" r="1"/><circle cx="130" cy="40" r="1"/><circle cx="160" cy="40" r="1"/>
      <circle cx="40" cy="70" r="1"/><circle cx="70" cy="70" r="1"/><circle cx="100" cy="70" r="1"/><circle cx="130" cy="70" r="1"/><circle cx="160" cy="70" r="1"/>
      <circle cx="40" cy="100" r="1"/><circle cx="70" cy="100" r="1"/><circle cx="100" cy="100" r="1"/><circle cx="130" cy="100" r="1"/><circle cx="160" cy="100" r="1"/>
    </g>
    <!-- food -->
    <circle cx="160" cy="70" r="5" fill="#F87171">
      <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- snake body segments moving -->
    <g fill="#34D399" filter="url(#g)">
      <rect x="36" y="36" width="14" height="14" rx="3">
        <animate attributeName="x" values="36;36;36;66;96;96;66;36" keyTimes="0;0.15;0.25;0.45;0.65;0.75;0.9;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;66;96;96;96;66;66;36" keyTimes="0;0.15;0.25;0.45;0.65;0.75;0.9;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="36" width="14" height="14" rx="3" opacity="0.7">
        <animate attributeName="x" values="36;36;36;36;66;96;66;36" keyTimes="0;0.05;0.15;0.25;0.45;0.65;0.85;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;36;66;96;96;96;66;36" keyTimes="0;0.05;0.15;0.25;0.45;0.65;0.85;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="36" width="14" height="14" rx="3" opacity="0.45">
        <animate attributeName="x" values="36;36;36;36;36;66;66;36" keyTimes="0;0;0.05;0.15;0.25;0.45;0.65;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;36;36;66;96;96;66;36" keyTimes="0;0;0.05;0.15;0.25;0.45;0.65;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="12" y="120" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">score 42 · loop 4s</text>
  </g>

  <!-- PONG -->
  <g transform="translate(240,48)">
    <rect width="200" height="130" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="12" y="20" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#38BDF8">pong.asm</text>
    <!-- center line -->
    <line x1="100" y1="30" x2="100" y2="120" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 6"/>
    <!-- paddles -->
    <rect x="14" y="50" width="6" height="30" rx="2" fill="#38BDF8">
      <animate attributeName="y" values="40;80;50;70;40" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="50" width="6" height="30" rx="2" fill="#A78BFA">
      <animate attributeName="y" values="70;40;80;50;70" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- ball -->
    <circle cx="100" cy="70" r="5" fill="#E2E8F0" filter="url(#g)">
      <animate attributeName="cx" values="22;178;22;178;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="55;85;60;80;55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="28" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#E2E8F0">3</text>
    <text x="130" y="28" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#E2E8F0">2</text>
  </g>

  <!-- BREAKOUT -->
  <g transform="translate(456,48)">
    <rect width="240" height="130" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="12" y="20" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#FBBF24">breakout.c</text>
    <!-- bricks -->
    <g>
      <rect x="20" y="32" width="28" height="10" rx="2" fill="#F87171"><animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="52" y="32" width="28" height="10" rx="2" fill="#FB923C"/>
      <rect x="84" y="32" width="28" height="10" rx="2" fill="#FBBF24"/>
      <rect x="116" y="32" width="28" height="10" rx="2" fill="#4ADE80"><animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="148" y="32" width="28" height="10" rx="2" fill="#38BDF8"/>
      <rect x="180" y="32" width="28" height="10" rx="2" fill="#A78BFA"/>
      <rect x="20" y="46" width="28" height="10" rx="2" fill="#FB923C"/>
      <rect x="52" y="46" width="28" height="10" rx="2" fill="#FBBF24"><animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="84" y="46" width="28" height="10" rx="2" fill="#4ADE80"/>
      <rect x="116" y="46" width="28" height="10" rx="2" fill="#38BDF8"/>
      <rect x="148" y="46" width="28" height="10" rx="2" fill="#A78BFA"><animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="180" y="46" width="28" height="10" rx="2" fill="#F87171"/>
    </g>
    <!-- paddle + ball -->
    <rect x="100" y="112" width="40" height="6" rx="2" fill="#E2E8F0">
      <animate attributeName="x" values="40;160;80;140;40" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="120" cy="80" r="4" fill="#FBBF24">
      <animate attributeName="cx" values="60;180;90;150;60" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;70;90;75;100" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="120" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#475569">bricks 8/12</text>
  </g>

  <text x="24" y="190" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#475569">SVG demos below are previews. Full games: playground repo → GitHub Pages.</text>
</svg>
