<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#0D1528"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="320" fill="url(#bg)"/>
  <text x="32" y="36" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94A3B8" letter-spacing="3">STACK COMPOSITION · SHIPPED WORK</text>

  <!-- Donut: approximate distribution of primary tech across projects -->
  <!-- circumference = 2*pi*80 ≈ 502.65 -->
  <g transform="translate(170,175)">
    <circle r="80" fill="none" stroke="#1E293B" stroke-width="28"/>
    <!-- React/TS 28% -->
    <circle r="80" fill="none" stroke="#22D3EE" stroke-width="28"
      stroke-dasharray="141 362" stroke-dashoffset="0" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;141 362" dur="1.2s" fill="freeze"/>
    </circle>
    <!-- Node/Express 18% -->
    <circle r="80" fill="none" stroke="#818CF8" stroke-width="28"
      stroke-dasharray="90 413" stroke-dashoffset="-141" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;90 413" dur="1.2s" begin="0.15s" fill="freeze"/>
    </circle>
    <!-- Firebase/Supabase 22% -->
    <circle r="80" fill="none" stroke="#34D399" stroke-width="28"
      stroke-dasharray="111 392" stroke-dashoffset="-231" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;111 392" dur="1.2s" begin="0.3s" fill="freeze"/>
    </circle>
    <!-- Python/AI 14% -->
    <circle r="80" fill="none" stroke="#F59E0B" stroke-width="28"
      stroke-dasharray="70 433" stroke-dashoffset="-342" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;70 433" dur="1.2s" begin="0.45s" fill="freeze"/>
    </circle>
    <!-- Payments/USSD 10% -->
    <circle r="80" fill="none" stroke="#F472B6" stroke-width="28"
      stroke-dasharray="50 453" stroke-dashoffset="-412" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;50 453" dur="1.2s" begin="0.6s" fill="freeze"/>
    </circle>
    <!-- Mobile/Other 8% -->
    <circle r="80" fill="none" stroke="#38BDF8" stroke-width="28"
      stroke-dasharray="40 463" stroke-dashoffset="-462" transform="rotate(-90)" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 503;40 463" dur="1.2s" begin="0.75s" fill="freeze"/>
    </circle>
    <text y="-6" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="28" fill="#E2E8F0" font-weight="600">6</text>
    <text y="16" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">layers</text>
  </g>

  <!-- Legend -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="13" transform="translate(300,70)">
    <g><rect width="12" height="12" y="4" rx="2" fill="#22D3EE"/><text x="22" y="14" fill="#E2E8F0">React / TypeScript</text><text x="220" y="14" fill="#64748B">28%</text></g>
    <g transform="translate(0,32)"><rect width="12" height="12" y="4" rx="2" fill="#818CF8"/><text x="22" y="14" fill="#E2E8F0">Node / Express</text><text x="220" y="14" fill="#64748B">18%</text></g>
    <g transform="translate(0,64)"><rect width="12" height="12" y="4" rx="2" fill="#34D399"/><text x="22" y="14" fill="#E2E8F0">Firebase / Supabase</text><text x="220" y="14" fill="#64748B">22%</text></g>
    <g transform="translate(0,96)"><rect width="12" height="12" y="4" rx="2" fill="#F59E0B"/><text x="22" y="14" fill="#E2E8F0">Python / AI · RAG</text><text x="220" y="14" fill="#64748B">14%</text></g>
    <g transform="translate(0,128)"><rect width="12" height="12" y="4" rx="2" fill="#F472B6"/><text x="22" y="14" fill="#E2E8F0">M-Pesa / USSD</text><text x="220" y="14" fill="#64748B">10%</text></g>
    <g transform="translate(0,160)"><rect width="12" height="12" y="4" rx="2" fill="#38BDF8"/><text x="22" y="14" fill="#E2E8F0">Mobile / PWA / other</text><text x="220" y="14" fill="#64748B">8%</text></g>
  </g>

  <!-- Domain bars -->
  <g transform="translate(560,55)" font-family="ui-monospace,Menlo,monospace">
    <text x="0" y="0" font-size="11" fill="#94A3B8" letter-spacing="2">PROJECT DOMAINS</text>
    <!-- bars: label, value 0-100, color -->
    <g transform="translate(0,20)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Legal tech</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#A78BFA">
        <animate attributeName="width" values="0;180" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="188" y="30" font-size="11" fill="#64748B">12</text>
    </g>
    <g transform="translate(0,58)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Education / campus</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#22D3EE">
        <animate attributeName="width" values="0;160" dur="1.1s" begin="0.1s" fill="freeze"/>
      </rect>
      <text x="168" y="30" font-size="11" fill="#64748B">10</text>
    </g>
    <g transform="translate(0,96)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Client websites</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#34D399">
        <animate attributeName="width" values="0;220" dur="1.1s" begin="0.2s" fill="freeze"/>
      </rect>
      <text x="228" y="30" font-size="11" fill="#64748B">18</text>
    </g>
    <g transform="translate(0,134)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Field ops / logistics</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#38BDF8">
        <animate attributeName="width" values="0;80" dur="1.1s" begin="0.3s" fill="freeze"/>
      </rect>
      <text x="88" y="30" font-size="11" fill="#64748B">6</text>
    </g>
    <g transform="translate(0,172)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Payments / fintech</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#F59E0B">
        <animate attributeName="width" values="0;100" dur="1.1s" begin="0.4s" fill="freeze"/>
      </rect>
      <text x="108" y="30" font-size="11" fill="#64748B">7</text>
    </g>
    <g transform="translate(0,210)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Health / community</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#F472B6">
        <animate attributeName="width" values="0;90" dur="1.1s" begin="0.5s" fill="freeze"/>
      </rect>
      <text x="98" y="30" font-size="11" fill="#64748B">6</text>
    </g>
    <g transform="translate(0,248)">
      <text x="0" y="12" font-size="12" fill="#CBD5E1">Games / experiments</text>
      <rect x="0" y="20" width="0" height="10" rx="5" fill="#FB7185">
        <animate attributeName="width" values="0;50" dur="1.1s" begin="0.6s" fill="freeze"/>
      </rect>
      <text x="58" y="30" font-size="11" fill="#64748B">4</text>
    </g>
  </g>
</svg>
